    <style>
        :root {
            --primary: #087F8C;
            --dark: #12343B;
            --light: #F2FAFA;

        body {
            background-color: var(--light);
            color: var(--dark);
        }

        .navbar {
            background-color: var(--primary);
        }

        .navbar-brand {
            font-size: 25px;
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 10px;
        }

        .card-header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
        }

        .card-header h3 {
            color: white;
        }

        .card-body {
            padding: 25px;
        }

        h1,
        h2,
        h3 {
            color: var(--dark);
        }

        .form-label {
            color: var(--dark);
            font-weight: 500;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(8, 127, 140, 0.2);
        }

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background-color: var(--dark);
            border-color: var(--dark);
        }

        a {
            color: var(--primary);
        }

        a:hover {
            color: var(--dark);
        }

        footer {
            background-color: var(--dark);
            color: white;
        }

        .form-message {
            font-size: 14px;
            min-height: 1.4em;
        }

        .form-message.success {
            color: #0f7b4c;
            background-color: #e7f8ef;
            border: 1px solid #b7e4cc;
            border-radius: 8px;
            padding: 12px 14px;
        }

        .form-message.error {
            color: #b42318;
            background-color: #fdecec;
            border: 1px solid #f2c2c0;
            border-radius: 8px;
            padding: 12px 14px;
        }
    </style>

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">Carevia</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="aboutus.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    <!-- Registration Form -->
    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-header text-center">

                        <h3 class="mb-1">Create an Account</h3>

                        <p class="mb-0">Your Health, Your Time.</p>

                    </div>

                    <div class="card-body">

                        <form id="registerForm" action="register.php" method="POST" novalidate>

                            <!-- Full Name -->
                            <div class="mb-3">

                                <label for="fullname" class="form-label">
                                    Full Name
                                </label>

                                <input type="text" class="form-control"
                                    id="fullname" name="fullname"
                                    placeholder="Enter your full name"
                                    maxlength="150" autocomplete="name"
                                    required  oninput="this.value = this.value.toUpperCase()"
    required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email" class="form-control"
                                    id="email" name="email"
                                    placeholder="Enter your email address"
                                    maxlength="150" autocomplete="email"
                                    required>

                            </div>


                            <!-- Phone Number -->
                            <div class="mb-3">

                                <label for="phone" class="form-label">
                                    Phone Number
                                </label>

                                <input type="tel" class="form-control"
                                    id="phone" name="phone"
                                    placeholder="Enter your 10-digit phone number"
                                    pattern="[0-9]{10}"
                                    maxlength="10" inputmode="numeric" autocomplete="tel"
                                    title="Enter a 10-digit phone number"
                                    required oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    required>

                            </div>


                            <!-- Date of Birth -->
                            <div class="mb-3">

                                <label for="dob" class="form-label">
                                    Date of Birth
                                </label>

                                <input type="date" class="form-control"
                                    id="dob" name="dob"
                                    min="1000-01-01" autocomplete="bday"
                                    required>

                            </div>


                            <!-- Gender -->
                            <div class="mb-3">

                                <label for="gender" class="form-label">
                                    Gender
                                </label>

                                <select class="form-select"
                                    id="gender" name="gender" required>

                                    <option value="">Select Gender</option>
                                    <option value="female">Female</option>
                                    <option value="male">Male</option>
                                    <option value="other">Other</option>
                                    <option value="prefer-not-to-say">
                                        Prefer not to say
                                    </option>

                                </select>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input type="password" class="form-control"
                                    id="password" name="password"
                                    placeholder="Create a password"
                                    minlength="6"
                                    maxlength="72" autocomplete="new-password"
                                    required>

                            </div>


                            <!-- Confirm Password -->
                            <div class="mb-3">

                                <label for="confirmPassword" class="form-label">
                                    Confirm Password
                                </label>

                                <input type="password" class="form-control"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Enter your password again"
                                    maxlength="72" autocomplete="new-password"
                                    required>

                            </div>


                            <!-- Terms and Conditions -->
                            <div class="form-check mb-3">

                                <input type="checkbox"
                                    class="form-check-input"
                                    id="terms" name="terms" required>

                                <label class="form-check-label" for="terms">
                                    I agree to the terms and conditions.
                                </label>

                            </div>


                            <!-- Form status message -->
                            <div id="formMessage"
     class="alert d-none"
     role="status"
     aria-live="polite"
     aria-atomic="true"
     tabindex="-1">
</div>


                            <!-- Register Button -->
                            <button type="submit"
                                class="btn btn-primary w-100">

                                Register

                            </button>

                        </form>


                        <!-- Login Link -->
                        <p class="text-center mt-3 mb-0">

                            Already have an account?

                            <a href="login.html">Login</a>

                        </p>

                    </div>

                </div>


                <!-- Back to Home -->
                <div class="text-center mt-3">

                    <a href="index.html" class="text-decoration-none">
                        Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer class="text-center py-3">

        <p class="mb-0">

        </p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Registration form JavaScript -->
    <script>
        const registerForm = document.getElementById("registerForm");
        const formMessage = document.getElementById("formMessage");
        const submitButton = registerForm.querySelector('button[type="submit"]');
        const dobInput = document.getElementById("dob");
        dobInput.max = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Colombo", year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date());

        function showFormMessage(text, type) {

    formMessage.textContent = text;

    formMessage.classList.remove(
        "d-none",
        "alert-success",
        "alert-danger"
    );

    if (type === "success") {
        formMessage.classList.add("alert-success");
    } else {
        formMessage.classList.add("alert-danger");
    }

    formMessage.focus({ preventScroll: true });

    formMessage.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (submitButton.disabled) {
                return;
            }

            const fullname = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const dob = document.getElementById("dob").value.trim();
            const gender = document.getElementById("gender").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const terms = document.getElementById("terms").checked;

            if (!fullname || !email || !phone || !dob || !gender || !password || !confirmPassword) {
                showFormMessage("Please fill in all fields.", "error");
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showFormMessage("Please enter a valid email address.", "error");
                return;
            }

            if (!/^[0-9]{10}$/.test(phone)) {
                showFormMessage("Please enter a valid 10-digit phone number.", "error");
                return;
            }

            if (!dobInput.validity.valid || dob < dobInput.min || dob > dobInput.max) {
                showFormMessage("Date of birth must be a valid date on or before today.", "error");
                return;
            }

            if (fullname.length > 150 || email.length > 150) {
                showFormMessage("Full name and email must each be 150 characters or fewer.", "error");
                return;
            }

            if (password.length < 6) {
                showFormMessage("Password must be at least 6 characters.", "error");
                return;
            }

            if (new TextEncoder().encode(password).length > 72) {
                showFormMessage("Password must be 72 bytes or fewer. Use fewer characters.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showFormMessage("Passwords do not match. Please try again.", "error");
                return;
            }

            if (!terms) {
                showFormMessage("Please agree to the terms and conditions.", "error");
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Registering...";
            registerForm.setAttribute("aria-busy", "true");
            formMessage.textContent = "";

formMessage.classList.add("d-none");

formMessage.classList.remove(
    "alert-success",
    "alert-danger"
);

            try {
                const response = await fetch(registerForm.action, {
                    method: "POST",
                    body: new FormData(registerForm),
                    headers: {
                        Accept: "application/json"
                    }
                });

                const data = await response.json();

                if (response.ok && data.ok) {
                    showFormMessage(data.message, "success");
                    registerForm.reset();
                } else {
                    showFormMessage(data.message || "Unable to complete registration right now. Please try again.", "error");
                }
            } catch (error) {
                showFormMessage("Unable to complete registration right now. Please try again.", "error");
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Register";
                registerForm.removeAttribute("aria-busy");
            }
        });
        
document.addEventListener("DOMContentLoaded", function () {

    const fullname = document.getElementById("fullname");
    const email = document.getElementById("email");
    const phone = document.getElementById("phone");

    // Full Name Validation
    fullname.addEventListener("input", function () {

        if (this.value.trim().length < 3) {
            this.classList.add("is-invalid");
            this.classList.remove("is-valid");
        } else {
            this.classList.remove("is-invalid");
            this.classList.add("is-valid");
        }

    });

    // Email Validation
    email.addEventListener("input", function () {

        if (!this.validity.valid || this.value.trim() === "") {
            this.classList.add("is-invalid");
            this.classList.remove("is-valid");
        } else {
            this.classList.remove("is-invalid");
            this.classList.add("is-valid");
        }

    });

    // Phone Validation
    phone.addEventListener("input", function () {

        if (!/^[0-9]{10}$/.test(this.value)) {
            this.classList.add("is-invalid");
            this.classList.remove("is-valid");
        } else {
            this.classList.remove("is-invalid");
            this.classList.add("is-valid");
        }

    });

});

    </script>

</body>

</html>
