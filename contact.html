<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Carevia</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* General styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Navigation */

        .navbar {
            width: 100%;
            background-color: #12343B;
            padding: 12px 0;
        }

        .navbar-brand {
            font-size: 25px;
            font-weight: bold;
            color: #ffffff;
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.55);
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 0.15rem rgba(255, 255, 255, 0.25);
        }

        .navbar .nav-link {
            color: white;
            margin: 0 8px;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #8de0e5;
        }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #F2FAFA;
        }

        /* Contact card below the full-width navbar */
        .contact-container {
            max-width: 1100px;
            width: calc(100% - 30px);
            margin: 40px auto;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(18, 52, 59, 0.12);
        }

        

        /* Main row */
        main.row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        /* Left and right sections */
        .left,
        .right {
            flex: 1;
            min-width: 280px;
        }

        /* Contact title */
        .contactTitle h2 {
            color: #12343B;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .contactTitle p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Contact information */
        .contactInfo {
            margin-top: 25px;
        }

        .iconGroup {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 25px;
        }

        /* Contact icons */
        .icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            background-color: #087F8C;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        /* Contact details */
        .details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-wrap: anywhere;
        }

        .details span:first-child {
            font-size: 14px;
            color: #087F8C;
            font-weight: 600;
        }

        .details span:last-child {
            font-size: 15px;
            color: #12343B;
        }

        /* Social media */
        .socialMedia {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        .socialMedia a {
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: #087F8C;
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .socialMedia a:hover {
            background-color: #12343B;
            transform: translateY(-4px);
        }

        /* Contact form */
        .messageform {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            padding-top: 15px;
        }

        .inputGroup {
            position: relative;
            width: 100%;
        }

        .inputGroup.halfwidth {
            width: calc(50% - 11px);
        }

        /* Input fields */
        .inputGroup input,
        .inputGroup textarea {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid #cbdada;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            color: #12343B;
            font-size: 15px;
            transition: 0.3s ease;
        }

        .inputGroup input {
            height: 52px;
        }

        .inputGroup textarea {
            min-height: 150px;
            resize: vertical;
        }

        /* Input focus */
        .inputGroup input:focus,
        .inputGroup textarea:focus {
            border-color: #087F8C;
            box-shadow: 0 0 0 3px rgba(8, 127, 140, 0.12);
        }

        /* Floating labels */
        .inputGroup label {
            position: absolute;
            left: 12px;
            top: 15px;
            color: #6c8588;
            font-size: 14px;
            pointer-events: none;
            transition: 0.2s ease;
            background-color: #ffffff;
            padding: 0 4px;
        }

        .inputGroup input:focus + label,
        .inputGroup input:valid + label,
        .inputGroup textarea:focus + label,
        .inputGroup textarea:valid + label {
            top: -9px;
            left: 10px;
            font-size: 12px;
            color: #087F8C;
        }

        /* Send message button */
        .inputGroup button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: #087F8C;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .inputGroup button:hover {
            background-color: #12343B;
            transform: translateY(-2px);
        }

        /* Form message */
        .formMessage {
            width: 100%;
            font-size: 14px;
            margin-top: 5px;
            min-height: 1.4em;
        }

        .formMessage.success {
            color: #0f7b4c;
            background-color: #e7f8ef;
            border: 1px solid #b7e4cc;
            border-radius: 8px;
            padding: 12px 14px;
        }

        .formMessage.error {
            color: #b42318;
            background-color: #fdecec;
            border: 1px solid #f2c2c0;
            border-radius: 8px;
            padding: 12px 14px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .contact-container {
                width: calc(100% - 24px);
                margin: 20px auto;
                padding: 25px 20px;
            }

            main.row {
                gap: 30px;
            }

            .contactTitle h2 {
                font-size: 27px;
            }

            .inputGroup.halfwidth {
                width: 100%;
            }

            .socialMedia {
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
<!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-heart-pulse-fill"></i>
                Carevia
               
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">About</a>
                    </li>

                    

            
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-primary"
                            href="form.html">
                            Registration
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <div class="contact-container">

        <main class="row">

            <!-- Left Section: Contact Information -->
            <section class="col left">

                <div class="contactTitle">
                    <h2>Get In Touch</h2>
                    <p>
                        Have a question or need help?
                        Send us a message. We would love to hear from you.
                    </p>
                </div>

                <div class="contactInfo">

                    <!-- Phone -->
                    <div class="iconGroup">
                        <div class="icon">
                            <i class="fa-solid fa-phone" aria-hidden="true"></i>
                        </div>

                        <div class="details">
                            <span>Phone</span>
                            <span>0778347647</span>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="iconGroup">
                        <div class="icon">
                            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        </div>

                        <div class="details">
                            <span>Email</span>
                            <span>carevia@gmail.com</span>
                        </div>
                    </div>

                    <!-- Location -->
                    <div class="iconGroup">
                        <div class="icon">
                            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                        </div>

                        <div class="details">
                            <span>Location</span>
                            <span>Digana, Rajawella</span>
                        </div>
                    </div>

                    <!-- Social Media -->
                    <div class="socialMedia">

                        <a href="#" aria-label="Facebook">
                            <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                        </a>

                        <a href="#" aria-label="Twitter">
                            <i class="fa-brands fa-twitter" aria-hidden="true"></i>
                        </a>

                        <a href="#" aria-label="Instagram">
                            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                        </a>

                        <a href="#" aria-label="LinkedIn">
                            <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
                        </a>

                    </div>

                </div>

            </section>

            <!-- Right Section: Contact Form -->
            <section class="col right">

                <form class="messageform" id="contactForm" action="contact.php" method="POST" novalidate>

                    <!-- Name -->
                    <div class="inputGroup halfwidth">
                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required>

                        <label for="name">Name</label>
                    </div>

                    <!-- Email -->
                    <div class="inputGroup halfwidth">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>

                        <label for="email">Email</label>
                    </div>

                    <!-- Subject -->
                    <div class="inputGroup">
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required>

                        <label for="subject">Subject</label>
                    </div>

                    <!-- Message -->
                    <div class="inputGroup">
                        <textarea
                            id="message"
                            name="message"
                            required></textarea>

                        <label for="message">Message</label>
                    </div>

                    <!-- Submit Button -->
                    <div class="inputGroup">
                        <button type="submit">
                            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                            Send Message
                        </button>
                    </div>

                    <p class="formMessage" id="formMessage" role="status"></p>

                </form>

            </section>

        </main>

    </div>

    <!-- Bootstrap JavaScript (required for the mobile navbar toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- Contact form JavaScript -->
<script>
    const contactForm = document.getElementById("contactForm");
    const formMessage = document.getElementById("formMessage");
    const submitButton = contactForm.querySelector('button[type="submit"]');

    function showFormMessage(text, type) {
        formMessage.textContent = text;
        formMessage.classList.remove("success", "error");
        formMessage.classList.add(type);
    }

    contactForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const subject = document.getElementById("subject").value.trim();
        const message = document.getElementById("message").value.trim();

        if (!name || !email || !subject || !message) {
            showFormMessage("Please fill in all fields.", "error");
            return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showFormMessage("Please enter a valid email address.", "error");
            return;
        }

        submitButton.disabled = true;

        try {
            const response = await fetch("contact.php", {
                method: "POST",
                body: new FormData(contactForm),
                headers: {
                    Accept: "application/json"
                }
            });

            const data = await response.json();

            if (response.ok && data.ok) {
                showFormMessage(data.message, "success");
                contactForm.reset();
            } else {
                showFormMessage(data.message || "Unable to submit your message right now. Please try again.", "error");
            }
        } catch (error) {
            showFormMessage("Unable to submit your message right now. Please try again.", "error");
        } finally {
            submitButton.disabled = false;
        }
    });
</script>


</body>
</html>
